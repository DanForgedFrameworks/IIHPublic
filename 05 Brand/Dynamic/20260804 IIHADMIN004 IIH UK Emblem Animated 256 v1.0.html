<!DOCTYPE html><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;width:256px;height:256px;overflow:hidden}svg{display:block;width:256px;height:256px}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="IIH UK — Idiopathic Intracranial Hypertension. Working to relieve the pressure. Support, Advice, Information."><style>
/* Every element's resting state is fully visible. Motion is gated behind
   no-preference so a renderer that cannot animate shows the FINISHED logo,
   never a half-drawn frame.
   NEVER write a literal HTML tag in here, not even inside a comment. Inside
   inline SVG the HTML parser treats img/embed/iframe as breakout tags: it
   ends the SVG early and spills the rest of this CSS onto the page. */
.ring-path{stroke-dasharray:1198;stroke-dashoffset:0}
@media (prefers-reduced-motion: no-preference){
.lyr,.mk-breathe,.em-breathe{transform-box:fill-box;transform-origin:center}
.mk{animation:settle .82s cubic-bezier(.16,1,.3,1) both}
.mk-breathe{animation:breathe 5s ease-in-out 1.05s infinite}
.wm{animation:riseIn .60s cubic-bezier(.22,.61,.36,1) .26s both}
.ds{animation:fadeIn .50s ease-out .56s both}
.lyr-ring .ring-path{animation:draw 1.0s cubic-bezier(.22,.61,.36,1) both}
.lyr-hair{animation:fadeIn .5s ease-out .55s both}
.lyr-lockup{animation:popIn .6s cubic-bezier(.16,1,.3,1) .35s both}
.lyr-url{animation:riseIn .5s cubic-bezier(.22,.61,.36,1) .70s both}
.lyr-email{animation:riseIn .5s cubic-bezier(.22,.61,.36,1) .80s both}
.lyr-arctop{animation:fadeIn .55s ease-out .95s both}
.lyr-arcbot{animation:fadeIn .55s ease-out 1.05s both}
.lyr-ribbon{animation:popIn .5s cubic-bezier(.16,1,.3,1) 1.2s both}
.em-breathe{animation:breathe 5s ease-in-out 1.9s infinite}
@keyframes settle{from{opacity:0;transform:scale(.68) rotate(45deg)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1198}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
}
</style>
